<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Hotel Marqués Del Peñon es un espacio diseñado para despertar los sentidos y transformar cada momento en una experiencia única.">
    <title>Hotel Marqués Del Peñon</title>
    <link rel="stylesheet" href="assets/css/master.css">
    <link rel="stylesheet" href="assets/css/internas.css">
    <link rel="shortcut icon" href="assets/images/logo.svg" type="image/x-icon">

    <link href="https://fonts.cdnfonts.com/css/helvetica-neue-55" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/flickity@2/dist/flickity.min.css">
    <link rel="stylesheet" href="https://unpkg.com/flickity-fade@1/flickity-fade.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
</head>

<body>
    <!-- HEADER -->
    <gm-header></gm-header>

    <section class="topo">
        <div class="topo__content">
            <div class="topo__content--text">
                <h2 class="serif">Villas Remodeladas</h2>
            </div>
        </div>
    </section>

    <section class="suit-int internas">
        <div class="container">
            <div class="habitaciones-int__content">
                <div class="habitaciones-int__row">
                    <div class="habitaciones-int--slide col-md-12 col-xs-12 p-0">
                        <div class="habitaciones__slide--flickity">
                            <div class="habitaciones__slide--itens">
                                <img src="assets/images/habitaciones/villas-remodeladas/1.jpg"
                                    alt="Villas Remodeladas" class="img-fluid">
                            </div>
                            <div class="habitaciones__slide--itens">
                                <img src="assets/images/habitaciones/villas-remodeladas/2.jpg"
                                    alt="Villas Remodeladas" class="img-fluid">
                            </div>
                            <div class="habitaciones__slide--itens">
                                <img src="assets/images/habitaciones/villas-remodeladas/3.jpg"
                                    alt="Villas Remodeladas" class="img-fluid">
                            </div>
                            <div class="habitaciones__slide--itens">
                                <img src="assets/images/habitaciones/villas-remodeladas/4.jpg"
                                    alt="Villas Remodeladas" class="img-fluid">
                            </div>
                            <div class="habitaciones__slide--itens">
                                <img src="assets/images/habitaciones/villas-remodeladas/5.jpg"
                                    alt="Villas Remodeladas" class="img-fluid">
                            </div>
                            <div class="habitaciones__slide--itens">
                                <img src="assets/images/habitaciones/villas-remodeladas/6.jpg"
                                    alt="Villas Remodeladas" class="img-fluid">
                            </div>
                            <div class="habitaciones__slide--itens">
                                <img src="assets/images/habitaciones/villas-remodeladas/7.jpg"
                                    alt="Villas Remodeladas" class="img-fluid">
                            </div>
                            <div class="habitaciones__slide--itens">
                                <img src="assets/images/habitaciones/villas-remodeladas/8.jpg"
                                    alt="Villas Remodeladas" class="img-fluid">
                            </div>
                            <div class="habitaciones__slide--itens">
                                <img src="assets/images/habitaciones/villas-remodeladas/9.jpg"
                                    alt="Villas Remodeladas" class="img-fluid">
                            </div>
                        </div>
                    </div>

                    <div class="habitaciones__content--itens">
                        <div class="habitacione-prices">
                            <div class="habitacione-prices-box">
                                <h3>Todos los días</h3>
                                <table>
                                    <tbody>
                                        <tr>
                                            <td>12 Horas</td>
                                            <td>$ 460</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- <div class="habitaciones__tem">
                            <div class="habitaciones__calendar--itens">
                                <h4>Esta suite cuenta con:</h4>
                                <p>
                                    Canal para adultos, Secadora de cabello.
                                </p>
                            </div>
                        </div> -->
                    </div>
                </div>
            </div>
        </div>
    </section>
    <section class="destaque">
        <div class="destaque__content">
            <div class="Hotel__header title-header">
                <h2 class="title"><span><strong>O</strong> </span>tras suites</h2>
            </div>
            <div class="container-fluid">
                <div class="destaque__flickity">
                    <gm-suites></gm-suites>
                </div>
            </div>
            <div class="destaque__btn d-sm-block d-md-block d-lg-none">
                <a href="suites.html" class="btn btn-dark">Ver todas las suites</a>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <gm-footer></gm-footer>

    <script src="assets/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://unpkg.com/flickity@2/dist/flickity.pkgd.min.js"></script>
    <script src="https://unpkg.com/flickity-fade@1/flickity-fade.js"></script>
    <script src="assets/js/scripts.js"></script>

</html>
